# keymap-drawer 用の更新案（roBa.keymap.draft に対応）
# 注意：リポジトリ内の keymap-drawer/roBa.yaml は旧世代のキーマップのまま未更新だったため、
# 本ファイルは現行キーマップ＋設計案ドラフトの内容で全面書き直したもの。
# 変更9（2026-11-18）：default 層の位置28は 'BT 0'（単独コンボが実質機能）とし、'()' は NUM 層の位置17へ移設。
# 変更10（2026-11-18）：SYMBOLS 層の右手ホーム行を ( ) [ ] { } の括弧集約とし、';' は上段の位置5へ移設。
# 変更11（2026-11-18）：ARROW 層の空き位置に macOS 機能（Mission Control / アプリケーションウィンドウ / Launchpad）を追加。
# 変更12（2026-11-18）：MOUSE 層の文字キーを &to_layer_0 から通常キーへ簡素化（ラベルの「→L0」を除去）。
# 変更13（2026-11-18・決定実装）：automouse タイムアウト 100000ms → 20000ms（roBa_R.conf.draft 側の変更。図には現れない）。
# 変更14（2026-11-18・決定実装）：スナイプ層（レイヤー7・全て透過）を追加し、MOUSE 層の位置15に MO SNIPE（&mo 7）を配置。
